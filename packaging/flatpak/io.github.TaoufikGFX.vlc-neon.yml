# VLC Neon Flatpak (single-file bundle for GitHub releases, not Flathub)
#   flatpak-builder --user --force-clean --repo=repo build packaging/flatpak/io.github.TaoufikGFX.vlc-neon.yml
#   flatpak build-bundle repo vlc-neon.flatpak io.github.TaoufikGFX.vlc-neon
app-id: io.github.TaoufikGFX.vlc-neon
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: vlc-neon
rename-icon: vlc-neon
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.PowerManagement.Inhibit
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.vlc_neon
  - --env=VLC_PLUGIN_PATH=/app/lib64/vlc/plugins
  - --env=VLC_LIB_PATH=/app/lib64/vlc
  - --env=VLC_LIBEXEC_PATH=/app/libexec/vlc
  - --env=VLC_DATA_PATH=/app/share/vlc
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib64/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'
  - /lib/meson
  - /bin/meson
  - /bin/lua
  - /bin/luac

modules:
  # VLC 4 needs meson >= 1.10 (the SDK ships 1.9); build-time only
  - name: meson
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --target=/app/lib/meson meson-*.whl
      - mkdir -p /app/bin
      - printf '#!/bin/sh\nPYTHONPATH=/app/lib/meson exec python3 /app/lib/meson/bin/meson "$@"\n' > /app/bin/meson
      - chmod 755 /app/bin/meson
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/1d/c5/680527bdddf039807f22041882678b7f21d3380b4cdbc46abf2f24e2db6c/meson-1.11.2-py3-none-any.whl
        sha256: 7e4f6e83fec83e3eaac928e058b073c7557b282c35b6a2024cea143a39926a39

  - name: libass
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  # Header-only UTF-8 library libebml needs (it would otherwise download it at build time)
  - name: utfcpp
    buildsystem: cmake-ninja
    config-opts: [-DUTF8_TESTS=OFF, -DUTF8_SAMPLES=OFF, -DUTF8_INSTALL=ON]
    sources:
      - type: archive
        url: https://github.com/nemtrif/utfcpp/archive/refs/tags/v3.2.5.tar.gz
        sha256: 14fd1b3c466814cb4c40771b7f207b61d2c7a0aa6a5e620ca05c00df27f25afd

  - name: libebml
    buildsystem: cmake-ninja
    config-opts: [-DBUILD_SHARED_LIBS=ON, -DCMAKE_BUILD_TYPE=Release, -DCMAKE_INSTALL_LIBDIR=lib]
    sources:
      - type: archive
        url: https://dl.matroska.org/downloads/libebml/libebml-1.4.7.tar.xz
        sha256: 5b08214f929ee54c6187c370f84235fc9d0f2a2258c4d320d68eae6e2bdfd3f7

  - name: libmatroska
    buildsystem: cmake-ninja
    config-opts: [-DBUILD_SHARED_LIBS=ON, -DCMAKE_BUILD_TYPE=Release, -DCMAKE_INSTALL_LIBDIR=lib]
    sources:
      - type: archive
        url: https://dl.matroska.org/downloads/libmatroska/libmatroska-1.7.2.tar.xz
        sha256: f3e4d406daf7f1399962c43940e4a87de089474d5bcfbf2e6ca516e98bb87cfc

  - name: libdvbpsi
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://download.videolan.org/pub/libdvbpsi/1.3.3/libdvbpsi-1.3.3.tar.bz2
        sha256: 02b5998bcf289cdfbd8757bedd5987e681309b0a25b3ffe6cebae599f7a00112

  - name: lua
    buildsystem: simple
    build-commands:
      - make linux MYCFLAGS=-fPIC -j $FLATPAK_BUILDER_N_JOBS
      - make install INSTALL_TOP=/app
      - |
        install -Dm644 /dev/stdin /app/lib/pkgconfig/lua.pc <<EOF2
        prefix=/app
        libdir=\${prefix}/lib
        includedir=\${prefix}/include
        Name: Lua
        Description: Lua language engine
        Version: 5.4.9
        Libs: -L\${libdir} -llua -lm -ldl
        Cflags: -I\${includedir}
        EOF2
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.4.9.tar.gz
        sha256: 2335b6c582a52654f94612bf10d2f4672805d05329aa6568b1d8cd9e5c6fb8e6

  - name: vlc-neon
    buildsystem: meson
    builddir: true
    build-options:
      env:
        # Qt headers live in /usr/include here; moc needs that path, which pkg-config drops by default
        PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: '1'
        # meson re-runs itself (install step) through its own entry point
        PYTHONPATH: /app/lib/meson
    config-opts:
      - --libdir=lib64
      - --buildtype=release
      - -Dqt=enabled
      - -Dwayland=enabled
      - -Dtests=disabled
      - -Dqt_gtk=disabled
      - -Dskins2=disabled
      - -Dchromecast=disabled
      - -Drust=disabled
      - -Dnls=disabled
      - -Dmedialibrary=disabled
      - -Dmicrodns=disabled
      - -Davahi=disabled
      - -Dupnp=disabled
    post-install:
      - LD_LIBRARY_PATH=/app/lib64:/app/lib64/vlc /app/libexec/vlc/vlc-cache-gen /app/lib64/vlc/plugins
      - rm -rf /app/lib64/pkgconfig /app/include
    sources:
      - type: git
        url: https://code.videolan.org/videolan/vlc.git
        commit: e77e49b5dff7484dbf70cd1540a6a568e1890280
      - type: patch
        use-git: true
        paths:
          - ../../patches/0001-vlc-neon-app-identity.patch
          - ../../patches/0002-core-playback-repeat-thumbnails-snapshots.patch
          - ../../patches/0003-modules-gif-dvd-egl.patch
          - ../../patches/0004-qt-neon-interface.patch
      # Inside the sandbox the desktop/app ID is the Flatpak ID
      - type: shell
        commands:
          - sed -i 's/"org\.VideoLAN\.VLCNeon"/"io.github.TaoufikGFX.vlc-neon"/' bin/vlc.c modules/gui/qt/qt.cpp

  - name: vlc-neon-desktop
    buildsystem: simple
    build-commands:
      - sed -e 's/^StartupWMClass=.*/StartupWMClass=io.github.TaoufikGFX.vlc-neon/' -e '/^TryExec=/d'
        vlc-neon.desktop > io.github.TaoufikGFX.vlc-neon.desktop
      - install -Dm644 io.github.TaoufikGFX.vlc-neon.desktop -t /app/share/applications
      - sed -e 's/org\.VideoLAN\.VLCNeon/io.github.TaoufikGFX.vlc-neon/g'
        org.VideoLAN.VLCNeon.metainfo.xml > io.github.TaoufikGFX.vlc-neon.metainfo.xml
      - install -Dm644 io.github.TaoufikGFX.vlc-neon.metainfo.xml -t /app/share/metainfo
      - install -Dm644 vlc-neon.svg /app/share/icons/hicolor/scalable/apps/vlc-neon.svg
      - for s in 16 22 24 32 48 64 128 256 512; do install -Dm644 vlc-neon-$s.png /app/share/icons/hicolor/${s}x${s}/apps/vlc-neon.png; done
      - mkdir -p /app/share/kwin/scripts && cp -r vlc-neon-pip /app/share/kwin/scripts/
    sources:
      - type: file
        path: ../vlc-neon.desktop
      - type: file
        path: ../org.VideoLAN.VLCNeon.metainfo.xml
      - type: file
        path: ../../assets/icons/vlc-neon.svg
      - type: dir
        path: ../../assets/icons/png
      - type: dir
        path: ../kde
